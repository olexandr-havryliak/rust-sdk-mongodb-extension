name: miri

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  miri-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Miri on extension-sdk-mongodb (Docker)
        run: |
          bash .github/testing/miri.sh
