name: SDK benchmarks

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      base_ref:
        description: Baseline SDK commit or ref (current harness is held fixed)
        type: string
        default: HEAD~1
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: sdk-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: run
        name: Timing, instructions and allocations
        env:
          BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.sha || 'HEAD~1' }}
          BENCH_QUICK: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: bash .github/testing/bench.sh all
      - name: Publish execution and contract checks
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/performance/bench/*.xml
          check_run: false
          comment_mode: off
          compare_to_earlier_commit: false
          action_fail: true
          action_fail_on_inconclusive: true
      - name: Preserve measurements and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sdk-benchmarks
          path: reports/performance/bench/
          retention-days: 14
