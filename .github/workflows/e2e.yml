name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdk-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Rust unit tests (Docker; no host toolchain)
        run: |
          bash .github/testing/sdk.sh

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: End-to-end and random aggregation fuzz (Docker + MongoDB 9.0)
        env:
          ITERATIONS: "1500"
        run: |
          bash .github/testing/e2e.sh
