namespaces:
  "search_demo.products":
    index: "search_demo.products"
    vector:
      dimension: 384
      modelId: "${OPENSEARCH_MODEL_ID:-}"
    fields:
      name:
        sourcePath: "name"
        tags: ["search"]
      description:
        sourcePath: "description"
        tags: ["search", "vectorSearch"]
      category:
        sourcePath: "category"
        tags: ["filter"]
        type: "keyword"
      price:
        sourcePath: "price"
        tags: ["filter", "sort"]
        type: "float"
      inStock:
        sourcePath: "inStock"
        tags: ["filter"]
        type: "boolean"
      updatedAt:
        sourcePath: "updatedAt"
        tags: ["filter", "sort"]
        type: "date"
