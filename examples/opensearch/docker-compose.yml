# OpenSearch-backed MongoDB search demo. From repo root:
#   ./examples/opensearch/run-demo.sh test
services:
  mongo:
    build:
      context: ../..
      dockerfile: examples/opensearch/Dockerfile
      args:
        MONGO_IMAGE: ${MONGO_IMAGE:-mongodb/mongodb-community-server:9.0-ubi9}
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--setParameter",
        "featureFlagExtensionsAPI=true",
        "--setParameter",
        "featureFlagExtensionsApiSignatureValidation=false",
        "--extensionsConfigPath",
        "/etc/mongo/extensions",
        "--loadExtensions",
        "opensearch",
      ]
    ports:
      - "27030:27017"
    volumes:
      - ./scripts:/scripts:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'process.exit(db.adminCommand({ping:1}).ok ? 0 : 1)'",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s

  mongo-init:
    image: ${MONGO_IMAGE:-mongodb/mongodb-community-server:9.0-ubi9}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    command: ["mongosh", "mongodb://mongo:27017/admin", "/scripts/init-replica-set.js"]
    restart: "no"

  mongo-seed:
    image: ${MONGO_IMAGE:-mongodb/mongodb-community-server:9.0-ubi9}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/scripts:ro
      - ./datasets:/datasets:ro
    command: ["mongosh", "mongodb://mongo:27017/search_demo?replicaSet=rs0", "/scripts/seed.js"]
    restart: "no"

  kafka:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.8.0}
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-topic:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.8.0}
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic search_demo.products --partitions 1 --replication-factor 1
    restart: "no"

  connect:
    build:
      context: ../..
      dockerfile: examples/opensearch/Dockerfile.connect
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: opensearch-demo-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_LOG4J_ROOT_LOGLEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

  connect-setup:
    image: curlimages/curl:8.10.1
    depends_on:
      connect:
        condition: service_healthy
      kafka-topic:
        condition: service_completed_successfully
      mongo-seed:
        condition: service_completed_successfully
    volumes:
      - ./config:/config:ro
      - ./scripts/register-source-connector.sh:/register-source-connector.sh:ro
    command: ["/bin/sh", "/register-source-connector.sh"]
    restart: "no"

  opensearch:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:2.19.0}
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 40

  opensearch-model:
    image: python:3.11-slim
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./scripts/register-opensearch-model.py:/register-opensearch-model.py:ro
      - opensearch-model:/model
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_MODEL_ID_FILE: /model/model-id
      OPENSEARCH_MODEL_GROUP: mongodb-extension-poc
      OPENSEARCH_MODEL_NAME: huggingface/sentence-transformers/paraphrase-MiniLM-L3-v2
      OPENSEARCH_MODEL_VERSION: "1.0.2"
      OPENSEARCH_MODEL_FORMAT: ONNX
    command: ["python", "/register-opensearch-model.py"]
    restart: "no"

  opensearch-dashboards:
    image: ${OPENSEARCH_DASHBOARDS_IMAGE:-opensearchproject/opensearch-dashboards:2.19.0}
    profiles: ["dashboards"]
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"

  indexer:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: examples/opensearch/indexer/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      opensearch-model:
        condition: service_completed_successfully
      connect-setup:
        condition: service_completed_successfully
    volumes:
      - ./config:/config:ro
      - opensearch-model:/model:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPICS: search_demo.products
      KAFKA_GROUP_ID: mongodb-opensearch-indexer
      OPENSEARCH_URL: http://opensearch:9200
      INDEX_CONFIG: /config/indexing.yml
      OPENSEARCH_MODEL_ID_FILE: /model/model-id

  sync-tests:
    build:
      context: ../..
      dockerfile: examples/opensearch/tests/Dockerfile
    depends_on:
      indexer:
        condition: service_started
      connect-setup:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    profiles: ["test"]

  indexer-tests:
    build:
      context: ../..
      dockerfile: examples/opensearch/indexer/Dockerfile
    volumes:
      - ./indexer:/tests:ro
    working_dir: /tests
    command: ["python", "-m", "unittest", "-v", "test_indexer"]
    profiles: ["test"]

volumes:
  opensearch-model:
