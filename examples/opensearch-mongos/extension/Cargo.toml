[package]
name = "opensearch_mongos_extension"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Router-only OpenSearch vector search for sharded MongoDB collections"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bson = "2.15"
extension-sdk-mongodb = { path = "../../../extension-sdk-mongodb" }
opensearch_extension_core = { path = "../../opensearch/extension-core" }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json"] }
