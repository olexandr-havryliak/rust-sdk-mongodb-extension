[package]
name = "sdk_load_test"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MongoDB performance and fail-closed stress driver for SDK fixtures"

[dependencies]
bson = "2.15"
futures = "0.3"
mongodb = "3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
